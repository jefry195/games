<!DOCTYPE html>
<html lang="en">
  <head>
  <style id="arcade-device-responsive">
    /* Universal Mobile & Touch Responsiveness */
    html {
      box-sizing: border-box;
      -webkit-text-size-adjust: 100%;
    }
    *, *::before, *::after {
      box-sizing: inherit;
    }
    body {
      -webkit-tap-highlight-color: transparent;
    }
    #arcade-back-btn {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));
      z-index: 999999;
      background: rgba(15, 23, 42, 0.88);
      color: #38bdf8;
      text-decoration: none;
      padding: 7px 14px;
      border-radius: 9999px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition: transform 0.15s, background 0.15s;
    }
    #arcade-back-btn:hover {
      transform: scale(1.05);
      background: #1e293b;
      color: #fff;
    }
    #arcade-back-btn:active {
      transform: scale(0.95);
    }
    @media (max-width: 640px) {
      #arcade-back-btn {
        padding: 5px 11px;
        font-size: 12px;
        gap: 4px;
      }
      body {
        padding-top: max(48px, env(safe-area-inset-top)) !important;
        padding-left: max(4px, env(safe-area-inset-left)) !important;
        padding-right: max(4px, env(safe-area-inset-right)) !important;
      }
      canvas {
        max-width: 100% !important;
        height: auto !important;
      }
    }
  </style>
